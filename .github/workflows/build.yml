name: Build Android and Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import project
        run: godot --headless --editor --quit
      - name: Smoke test
        run: godot --headless --script res://tests/smoke.gd
      - name: Export Windows executable
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/CasaLivre.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CasaLivre-Windows
          path: build/windows/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "build-tools;35.0.1" "platforms;android-35"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import project
        run: godot --headless --editor --quit
      - name: Configure export paths
        run: godot --headless --editor --script res://tests/configure_android.gd
      - name: Create debug signing key
        run: |
          mkdir -p "$RUNNER_TEMP/casalivre-signing"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/casalivre-signing/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Export installable debug APK
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/CasaLivre-debug.apk
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/casalivre-signing/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
      - uses: actions/upload-artifact@v4
        with:
          name: CasaLivre-Android
          path: build/android/*.apk

  preview_release:
    name: Publish first downloadable preview
    needs: [windows, android]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CasaLivre-Android
          path: dist/android
      - uses: actions/download-artifact@v4
        with:
          name: CasaLivre-Windows
          path: dist/windows
      - name: Package Windows program
        run: |
          cd dist/windows
          zip -9 ../CasaLivre-Windows.zip ./*
      - name: Publish version 0.1 if not already present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'Version 0.1 is already published.'
          else
            gh release create v0.1.0 dist/android/CasaLivre-debug.apk dist/CasaLivre-Windows.zip \
              --title 'Casa Livre 0.1 — experimental preview' \
              --notes 'First playable low-poly house planner for Android and Windows. Experimental debug-signed APK; intended for testing, not production. On Android you may need to allow installation from this source.' \
              --prerelease
          fi
